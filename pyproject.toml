[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-oura"
version = "0.1.0"
description = "A Django app for the Oura API v2, backed by django-healthdatamodel."
readme = "README.md"
authors = [
    { name = "Andy Reagan", email = "andy@andyreagan.com" },
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.10"
dependencies = [
    "django",
    "django-healthdatamodel>=0.7.0",
    "httpx",
    "pydantic>=2",
    "python-dateutil",
]

[project.urls]
Homepage = "https://github.com/django-health/django-oura"
Repository = "https://github.com/django-health/django-oura"
Issues = "https://github.com/django-health/django-oura/issues"

[tool.hatch.build.targets.wheel]
packages = ["oura"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "respx",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
markers = [
    "live: requires real Oura OAuth credentials in env (OURA_TEST_*)",
]
